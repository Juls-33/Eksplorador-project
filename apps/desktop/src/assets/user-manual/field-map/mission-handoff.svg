<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">N1 mission deployment handoff</title><desc id="desc">Select ordered pins and send. Keep HOLD and DISARM during upload, restore radio feedback, inspect separate delivery, staging and onboard readiness. Only authorized physical HOLD to SEMI_AUTO starts movement. Arrival requires matching GPS reports.</desc>
<rect width="960" height="480" rx="20" fill="#f4f8f5"/><g font-family="system-ui,sans-serif" fill="#102819">
<text x="32" y="45" font-size="25" font-weight="700">Coordinates to supervised feedback navigation</text>
<g fill="white" stroke="#c9dece" stroke-width="2"><rect x="32" y="80" width="420" height="155" rx="12"/><rect x="508" y="80" width="420" height="155" rx="12"/><rect x="32" y="265" width="420" height="155" rx="12"/><rect x="508" y="265" width="420" height="155" rx="12"/></g>
<g font-size="21" font-weight="700"><text x="52" y="115">1. Select pins and Send Mission</text><text x="528" y="115">2. Observe delivery and staging</text><text x="52" y="300">3. Check readiness, authorize RC</text><text x="528" y="300">4. Observe movement and arrival</text></g>
<g font-size="17"><text x="52" y="148">Review order and payload capacity.</text><text x="52" y="177">HOLD + DISARM, rover CH8 RX.</text><text x="52" y="206">No GPS/calibration upload checkboxes.</text><text x="528" y="148">ACK2 is UART queue evidence only.</text><text x="528" y="177">After desktop RX, rover CH8 TX.</text><text x="528" y="206">Wait for fresh Mega telemetry.</text><text x="52" y="333">Stored measured calibration, GPS,</text><text x="52" y="362">heading, IMU and safety must qualify.</text><text x="52" y="391">Deliberate HOLD to SEMI_AUTO edge.</text><text x="528" y="333">Short encoder/gyro motion, GPS updates.</text><text x="528" y="362">PIN_CHECKED verifies its waypoint.</text><text x="528" y="391">Use RC HOLD/DISARM to stop.</text></g>
<text x="32" y="454" font-size="18">Upload and closing the assistant do not start or stop rover movement. No automatic soil probing.</text></g></svg>
